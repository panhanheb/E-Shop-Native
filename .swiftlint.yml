included:
  - MyApp

excluded:
  - MyApp/Resources

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_comments: true

type_body_length:
  warning: 300

file_length:
  warning: 400

identifier_name:
  excluded:
    - id
    - xs
    - sm
    - md
    - lg
    - xl

nesting:
  type_level: 2
