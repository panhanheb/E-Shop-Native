# XcodeGen spec — run `xcodegen generate` to create MyApp.xcodeproj.
name: MyApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: MyApp
        excludes:
          - "Tests/**"
          - "Resources/Info.plist"
    # Merged with the generated Info.plist. Lists the supported languages so iOS
    # shows the per-app Language option (English / ខ្មែរ) in the Settings app.
    info:
      path: MyApp/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - km
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    # Uncomment once SwiftLint is installed (brew install swiftlint):
    # postCompileScripts:
    #   - name: SwiftLint
    #     script: |
    #       export PATH="$PATH:/opt/homebrew/bin"
    #       if which swiftlint > /dev/null; then swiftlint; else echo "warning: SwiftLint not installed"; fi
    #     basedOnDependencyAnalysis: false

  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyApp/Tests/UnitTests
    dependencies:
      - target: MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.tests
        GENERATE_INFOPLIST_FILE: YES

  MyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MyApp/Tests/UITests
    dependencies:
      - target: MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MyApp:
    build:
      targets:
        MyApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - MyApp
      targets:
        - MyAppTests
        - MyAppUITests
